<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos – Viver Bem</title>
  <meta name="description" content="Veja todos os produtos naturais da Viver Bem: suplementos, chás, granel e cosméticos.">

  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0B6B2C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="catalogo">

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="container container-largo header-inner">
      <a href="index.html" class="logo-link" aria-label="Viver Bem – página inicial">
        <img src="assets/logo-amarelo.png" alt="Viver Bem" class="logo">
      </a>

      <div class="header-acoes">
        <a href="carrinho.html" class="carrinho-link" aria-label="Carrinho vazio">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 4h2.5l2.2 10.5a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/><circle cx="17" cy="19.5" r="1.4" fill="currentColor"/>
          </svg>
          <span class="carrinho-qtd" hidden>0</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      </div>

      <nav id="menu-principal" class="menu" aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a href="produtos.html" aria-current="page">Produtos</a>
        <a href="index.html#quem-somos">Quem somos</a>
        <a href="index.html#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="topo-pagina">
      <div class="container">
        <a href="index.html" class="voltar" data-voltar><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Voltar</span></a>
        <h1>Produtos</h1>
        <p class="lead">Escolha uma categoria ou veja tudo.</p>

        <!-- BUSCA -->
        <form class="busca" role="search" action="produtos.html" method="get">
          <label class="busca-rotulo" for="busca-produtos">Buscar produto</label>
          <input type="search" id="busca-produtos" name="busca" class="busca-campo" placeholder="Buscar produto" autocomplete="off" maxlength="60">
          <button type="submit" class="busca-botao" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.4"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
        </form>

        <!-- FILTROS -->
        <nav class="filtros" id="filtros" aria-label="Filtrar por categoria">
          <a href="produtos.html" class="chip ativo" data-filtro="todos" aria-current="true">Todos</a>
          <!-- As categorias entram aqui sozinhas -->
        </nav>
      </div>
    </section>

    <!-- GRADE DE PRODUTOS -->
    <section class="secao-grade">
      <div class="container">
        <div class="grid grid-produtos grid-catalogo" id="lista-produtos">
          <!-- Os cards entram aqui sozinhos, a partir de data/produtos.json -->
        </div>

        <p id="aviso-erro" class="aviso-erro" hidden></p>
        <p id="sem-produtos" class="vazio" hidden>Ainda não há produtos nesta categoria.</p>
      </div>
    </section>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="container container-largo footer-inner">
      <img src="assets/logo-amarelo.png" alt="Viver Bem" class="logo logo-rodape">
      <p>© <span id="ano">2026</span> Viver Bem – Produtos Naturais</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/config.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/loja.js"></script>
</body>
</html>
